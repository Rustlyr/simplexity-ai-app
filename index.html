<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simplex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <!-- Tab bar: on macOS it is the title bar, beside the traffic lights -->
    <header id="tabbar">
      <div id="tabs" role="tablist" aria-label="Tabs"></div>
      <button id="new-tab" type="button" aria-label="New tab" title="New Tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </header>
    <!-- Content -->
    <div id="content">
      <div id="webview-container">
        <!-- BrowserView content will be rendered here -->
      </div>
      <!-- Find Bar -->
      <div id="find-bar">
        <input type="text" id="find-input" placeholder="Find in page..." autocomplete="off" />
        <span id="find-matches">0 / 0</span>
        <button id="find-prev" title="Previous match">&#9650;</button>
        <button id="find-next" title="Next match">&#9660;</button>
        <button id="find-close" title="Close">&times;</button>
      </div>
    </div>
  </div>

  <script src="./src/js/renderer/renderer.js"></script>
</body>
</html>
